<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Самообучающийся агент над деревом задач — карта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15181B; --line:#2C3238;
    --ink:#E7E4DC; --ink-dim:#969CA2; --ink-faint:#6B7278;
    --c1:#E0A458; --c2:#5CB8AC; --c3:#A38CE6; --c4:#D9788C; --c5:#8FB26B;
    --c6:#6FA8DC; --c7:#C9A0C4; --c8:#9AA1A8; --c9:#E5C07B; --c10:#7FA9A0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; padding-bottom:64px;
  }
  header{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 72%,rgba(21,24,27,0));padding:20px 18px 14px}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
  h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:22px;line-height:1.22;margin:0 0 8px;letter-spacing:-.01em}
  .datalink{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;margin:0 0 12px}
  .datalink a{color:var(--c10);text-decoration:none;border-bottom:1px solid rgba(127,169,160,.4)}
  .datalink a:hover{border-bottom-color:var(--c10)}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
    background:transparent;color:var(--ink-dim);border:1px solid var(--line);border-radius:2px;
    padding:6px 10px;cursor:pointer;transition:color .15s,border-color .15s;
  }
  button:hover,button:focus-visible{color:var(--ink);border-color:var(--ink-faint)}
  button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
  button[aria-pressed="true"]{color:var(--bg);background:var(--c9);border-color:var(--c9)}

  main{padding:0 18px}
  ul{list-style:none;margin:0;padding:0}
  li{position:relative}
  li > ul{
    margin-left:7px;padding-left:17px;
    border-left:1px solid var(--branch,var(--line));
    border-left-color:color-mix(in srgb,var(--branch,var(--line)) 34%,transparent);
  }
  .row{display:flex;gap:9px;align-items:flex-start;padding:5px 0;position:relative}
  .dot{
    flex:0 0 auto;width:15px;height:22px;display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--branch,var(--ink-faint));margin-left:-1px;
  }
  li > ul > li > .row > .dot{margin-left:-25px;margin-right:9px}
  .txt{flex:1 1 auto;min-width:0}

  .lvl0 > .row{padding:14px 0 6px}
  .lvl0 > .row .label{
    font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--branch);font-weight:500;
  }
  .lvl1 > .row .label{font-weight:600;font-size:14.5px;color:var(--ink)}
  .lvl2 > .row .label{font-size:14px;color:var(--ink-dim)}

  .toggle{cursor:pointer;user-select:none}
  .toggle .label::after{
    content:"";display:inline-block;width:0;height:0;margin-left:7px;vertical-align:2px;
    border-left:4px solid var(--ink-faint);
    border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
    transition:transform .18s ease;transform-origin:2px 50%;
  }
  .open > .row .toggle .label::after{transform:rotate(90deg)}
  li:not(.open) > ul{display:none}

  .count{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);margin-left:6px}
  .tagline{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
  .kind-x .label{text-decoration:line-through;text-decoration-color:var(--ink-faint);opacity:.72}
  .kind-q .label{color:var(--c9)}
  #err{
    margin:20px 18px;padding:14px;border:1px solid var(--line);border-radius:2px;
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-dim);line-height:1.7;
  }
  #err code{color:var(--c9)}

  footer{
    margin:34px 18px 0;padding-top:14px;border-top:1px solid var(--line);
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.9;
    color:var(--ink-faint);letter-spacing:.03em;
  }
  footer b{color:var(--ink-dim);font-weight:500}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <p class="eyebrow">карта проекта · июль 2026</p>
  <h1>Самообучающийся агент<br>над деревом задач</h1>
  <p class="datalink"><a href="mindmap-data.md">источник данных — mindmap-data.md →</a></p>
  <div class="controls">
    <button id="expand">развернуть всё</button>
    <button id="collapse">свернуть до веток</button>
    <button id="qonly" aria-pressed="false">только вопросы</button>
  </div>
</header>

<main><ul id="tree"></ul></main>

<footer>
  <b>◆</b> решение принято &nbsp; <b>○</b> концепция / факт<br>
  <b>?</b> открытый вопрос &nbsp; <b>✕</b> отклонено или развёрнуто назад<br>
  карта рендерится из mindmap-data.md — правь данные, не HTML
</footer>

<script>
const BRANCH_COLORS = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8","--c9","--c10"];
const STATUS_GLYPH = {
  "решено":"◆", "концепция/факт":"○", "открытый вопрос":"?", "отклонено":"✕"
};
const STATUS_CLASS = {
  "решено":"kind-d", "концепция/факт":"kind-o", "открытый вопрос":"kind-q", "отклонено":"kind-x"
};

// --- parse mindmap-data.md into a tree ---
function parseMarkdown(text){
  text = text.replace(/^---\n[\s\S]*?\n---\n/, "");
  const lines = text.split("\n");
  const branches = [];
  let current = null;

  for (const raw of lines){
    const line = raw.trimEnd();
    const h2 = line.match(/^##\s+(.+)$/);
    if (h2){
      current = { title: h2[1].trim(), children: [], index: new Map() };
      branches.push(current);
      continue;
    }
    if (!current) continue;
    const item = line.match(/^-\s+(.+)$/);
    if (!item) continue;

    let body = item[1];

    let note = null;
    const noteSplit = body.split(" — примечание: ");
    if (noteSplit.length > 1){
      body = noteSplit[0];
      note = noteSplit.slice(1).join(" — примечание: ").trim();
    }

    let status = "концепция/факт";
    const st = body.match(/^(.*?)\s+\[([^\[\]]+)\]\s*$/);
    if (st){ body = st[1]; status = st[2].trim(); }

    const parts = body.split(" → ").map(s => s.trim()).filter(Boolean);
    const label = parts[parts.length - 1];
    const ancestors = parts.slice(0, -1);

    const node = { title: label, status, note, children: [] };

    let container = current.children;
    let key = "";
    for (const a of ancestors){
      key = key ? key + " → " + a : a;
      const parent = current.index.get(key);
      if (parent) container = parent.children;
      else break;
    }
    container.push(node);

    current.index.set(parts.join(" → "), node);
  }
  return branches;
}

// --- render ---
function render(branches, mount){
  branches.forEach((branch, i) => {
    const color = BRANCH_COLORS[i % BRANCH_COLORS.length];
    const li = buildNode({ title: branch.title, status: null, note: null, children: branch.children }, 0);
    li.style.setProperty("--branch", "var(" + color + ")");
    mount.appendChild(li);
  });
}

function buildNode(node, lvl){
  const li = document.createElement("li");
  li.className = "lvl" + lvl + " " + (STATUS_CLASS[node.status] || "kind-o");
  if (node.status === "открытый вопрос") li.dataset.q = "1";

  const row = document.createElement("div"); row.className = "row";
  const dot = document.createElement("span"); dot.className = "dot";
  dot.textContent = lvl === 0 ? "●" : (STATUS_GLYPH[node.status] || "○");
  const txt = document.createElement("div"); txt.className = "txt";

  const label = document.createElement("div"); label.className = "label";
  label.textContent = node.title;
  txt.appendChild(label);

  if (node.note){
    const s = document.createElement("div");
    s.className = "tagline"; s.textContent = node.note;
    txt.appendChild(s);
  }

  row.appendChild(dot); row.appendChild(txt); li.appendChild(row);

  if (node.children && node.children.length){
    li.classList.add("open");
    txt.classList.add("toggle");
    txt.setAttribute("role","button");
    txt.tabIndex = 0;
    txt.setAttribute("aria-expanded","true");

    const c = document.createElement("span");
    c.className = "count"; c.textContent = node.children.length;
    label.appendChild(c);

    const toggle = () => {
      li.classList.toggle("open");
      txt.setAttribute("aria-expanded", li.classList.contains("open"));
    };
    txt.addEventListener("click", toggle);
    txt.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
    });

    const ul = document.createElement("ul");
    node.children.forEach(child => ul.appendChild(buildNode(child, lvl + 1)));
    li.appendChild(ul);
  }
  return li;
}

// --- controls ---
const tree = document.getElementById("tree");

function setAll(open, maxLvl){
  tree.querySelectorAll("li").forEach(li => {
    if (!li.querySelector(":scope > ul")) return;
    const cls = [...li.classList].find(c => /^lvl\d+$/.test(c));
    const lvl = cls ? +cls.slice(3) : 0;
    const should = open ? true : lvl < maxLvl;
    li.classList.toggle("open", should);
    const t = li.querySelector(":scope > .row .toggle");
    if (t) t.setAttribute("aria-expanded", should);
  });
}
document.getElementById("expand").onclick = () => setAll(true);
document.getElementById("collapse").onclick = () => setAll(false, 0);

const q = document.getElementById("qonly");
q.onclick = () => {
  const on = q.getAttribute("aria-pressed") !== "true";
  q.setAttribute("aria-pressed", on);
  tree.querySelectorAll("li").forEach(li => {
    const hasQ = li.dataset.q === "1" || li.querySelector('[data-q="1"]');
    li.style.display = (!on || hasQ) ? "" : "none";
  });
  if (on) setAll(true);
};

// --- load ---
fetch("mindmap-data.md", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(text => render(parseMarkdown(text), tree))
  .catch(err => {
    const box = document.createElement("div");
    box.id = "err";
    box.innerHTML = "Не удалось загрузить <code>mindmap-data.md</code> (" + err.message + ").<br>" +
      "Карта рендерится из этого файла, он должен лежать рядом. " +
      "При открытии по file:// браузер блокирует fetch — открывай через GitHub Pages или локальный сервер.";
    document.querySelector("main").appendChild(box);
  });
</script>
</body>
</html>
