<style>

    --c7:#C9A0C4;  /* интерфейс */

    --c10:#7FA9A0; /* документы */

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px;
  }
  h1{
    font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;

  }
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
    background:transparent;color:var(--ink-dim);
    border:1px solid var(--line);border-radius:2px;
    padding:6px 10px;cursor:pointer;

  main{padding:0 18px}
  ul{list-style:none;margin:0;padding:0}
  li{position:relative}

  /* ── сигнатура: рельса коммитов ── */
  li > ul{
    margin-left:7px;
    padding-left:17px;
    border-left:1px solid var(--branch,var(--line));
    border-left-color:color-mix(in srgb,var(--branch,var(--line)) 34%,transparent);
  }
  .row{
    display:flex;gap:9px;align-items:flex-start;
    padding:5px 0;
    position:relative;
  }
  .dot{
    flex:0 0 auto;width:15px;height:22px;
    display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;font-size:11px;
    color:var(--branch,var(--ink-faint));
    margin-left:-1px;
  }
  li > ul > li > .row > .dot{margin-left:-25px;margin-right:9px}
  .txt{flex:1 1 auto;min-width:0}

  /* уровни */
  .lvl0 > .row{padding:14px 0 6px}
  .lvl0 > .row .label{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--branch);font-weight:500;
  }
  .lvl1 > .row .label{font-weight:600;font-size:14.5px;color:var(--ink)}
  .lvl2 > .row .label,.lvl3 > .row .label{font-size:14px;color:var(--ink-dim)}
  .lvl3 > .row .label{font-size:13.5px}

  .toggle{cursor:pointer;user-select:none}
  .toggle .label::after{
    content:"";display:inline-block;
    width:0;height:0;margin-left:7px;vertical-align:2px;
    border-left:4px solid var(--ink-faint);
    border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
    transition:transform .18s ease;transform-origin:2px 50%;
  }
  .open > .row .toggle .label::after{transform:rotate(90deg)}
  li:not(.open) > ul{display:none}

  .count{
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    color:var(--ink-faint);margin-left:6px;
  }
  .tagline{
    font-size:12.5px;color:var(--ink-faint);
    margin-top:2px;font-style:normal;
  }
  mark{
    background:none;color:var(--branch);font-weight:500;
  }
  .kind-x .label{text-decoration:line-through;text-decoration-color:var(--ink-faint);opacity:.72}
  .kind-q .label{color:var(--c9)}

  footer{
    margin:34px 18px 0;padding-top:14px;border-top:1px solid var(--line);
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.9;
    color:var(--ink-faint);letter-spacing:.03em;
  }
  footer b{color:var(--ink-dim);font-weight:500}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const GLYPH = {"o":"○","◆":"◆","?":"?","✕":"✕"};
const KIND  = {"◆":"kind-d","o":"kind-o","?":"kind-q","✕":"kind-x"};

function build(nodes, lvl, parentEl){
  nodes.forEach(n=>{
    const li=document.createElement("li");
    li.className="lvl"+lvl+" "+(KIND[n.k]||"kind-o");
    if(n.c) li.style.setProperty("--branch","var("+n.c+")");
    if(n.k==="?") li.dataset.q="1";

    const row=document.createElement("div"); row.className="row";
    const dot=document.createElement("span"); dot.className="dot";
    dot.textContent=lvl===0 ? "●" : (GLYPH[n.k]||"○");
    const txt=document.createElement("div"); txt.className="txt";

    const label=document.createElement("div"); label.className="label"; label.textContent=n.t;
    txt.appendChild(label);
    if(n.n){const s=document.createElement("div");s.className="tagline";s.textContent=n.n;txt.appendChild(s);}

    row.appendChild(dot); row.appendChild(txt); li.appendChild(row);

    if(n.ch&&n.ch.length){
      li.classList.add("open");
      txt.classList.add("toggle");
      txt.setAttribute("role","button");
      txt.tabIndex=0;
      txt.setAttribute("aria-expanded","true");
      const c=document.createElement("span"); c.className="count"; c.textContent=n.ch.length;
      label.appendChild(c);
      const toggle=()=>{
        li.classList.toggle("open");
        txt.setAttribute("aria-expanded", li.classList.contains("open"));
      };
      txt.addEventListener("click",toggle);
      txt.addEventListener("keydown",e=>{
        if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}
      });
      const ul=document.createElement("ul");
      build(n.ch, lvl+1, ul);
      li.appendChild(ul);
    }
    parentEl.appendChild(li);
  });
}

const tree=document.getElementById("tree");
build(D,0,tree);

function setAll(open, maxLvl){
  tree.querySelectorAll("li").forEach(li=>{
    if(!li.querySelector(":scope > ul")) return;
    const lvl=+[...li.classList].find(c=>c.startsWith("lvl")).slice(3);
    const should = open ? true : lvl < maxLvl;
    li.classList.toggle("open", should);
    const t=li.querySelector(":scope > .row .toggle");
    if(t) t.setAttribute("aria-expanded", should);
  });
}
document.getElementById("expand").onclick=()=>setAll(true);
document.getElementById("collapse").onclick=()=>setAll(false,0);

const q=document.getElementById("qonly");
q.onclick=()=>{
  const on = q.getAttribute("aria-pressed")!=="true";
  q.setAttribute("aria-pressed", on);
  tree.querySelectorAll("li").forEach(li=>{
    const hasQ = li.dataset.q==="1" || li.querySelector('[data-q="1"]');
    li.style.display = (!on || hasQ) ? "" : "none";
  });
  if(on) setAll(true);
};
